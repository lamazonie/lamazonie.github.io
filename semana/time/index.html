<!doctype html>
<html lang="pt-BR" class="loading" data-view="time" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Criativos da semana · Marketing e edição</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="O que vendeu, o que cansou e o que produzir agora. Atualizado toda segunda.">
<meta name="theme-color" content="#faf8f3">
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Roboto+Condensed:wght@300;400;500&display=swap">
<style>
/* Uma coluna calma. Cor só no status. O vídeo é o protagonista. */
:root{
  color-scheme: light only;
  --bg:#faf8f3; --surface:#ffffff; --ink:#0e2a25; --muted:#5e6f69; --faint:#68756f; --line:#e8e6df;
  --brand:#0e423a; --gold:#8a6b2e; --ok-ink:#17704a; --warn-ink:#8a5a12;
  --ok:#1f8a55; --door:#2f6ed1; --warn:#b7791f; --bad:#c2453a; --neutral:#8a948e;
  --ok-bg:#e6f4ec; --warn-bg:#f8efdc; --bad-bg:#f9e7e4; --na-bg:#eef0ed;
  --display:"Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --sans:"Sora", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --r:14px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--ink);font:300 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
img,video{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left)) max(20px,env(safe-area-inset-right))}

/* topo */
header.top .wrap{padding-block:20px 12px;display:grid;gap:8px}
:root[data-view=creators] .eyebrow{display:none}
.eyebrow{font:400 12px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.eyebrow a{text-decoration:none}
h1{font:300 28px/1.1 var(--display);letter-spacing:-.005em;text-transform:uppercase}
.logo{height:26px;width:auto}
header.top a[aria-label]{display:inline-flex;align-items:center;min-height:44px;justify-self:start}
.logo.dark{display:none}
h1 em{font-style:normal;color:var(--gold)}
.period{display:flex;gap:10px;align-items:center;font:500 12px var(--mono);color:var(--muted)}
.period select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

/* recado */
.recado{display:grid;gap:12px;padding-block:4px 12px}
.recado ol{list-style:none;padding:0;display:grid;gap:14px;counter-reset:r}
.recado li{display:grid;grid-template-columns:28px 1fr;gap:6px;font-size:16px;line-height:1.5}
.recado li::before{counter-increment:r;content:"0" counter(r);font:500 12px/2.2 var(--mono);color:var(--gold)}
.lesson{font:400 16px/1.5 var(--sans);color:var(--ink);border-left:2px solid var(--gold);padding:2px 0 2px 16px}
.headline{font:400 20px/1.25 var(--display);letter-spacing:.005em;max-width:30ch}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys span{font-size:14px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--ok-bg);color:var(--ok-ink)}
details.more{border-top:1px solid var(--line)}
details.more summary{cursor:pointer;list-style:none;min-height:44px;align-items:center;font-size:14px;font-weight:500;color:var(--muted);display:flex;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-family:var(--mono);color:var(--faint)}
details.more[open] summary::after{content:"–"}
details.more > div{display:grid;gap:10px;margin:4px 0 8px;font-size:14px;color:var(--muted)}
.tiles{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:84px;display:grid;gap:6px;text-align:left}
.tile .ph{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--na-bg)}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .ph i{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#111}
.tile .ph i svg{width:8px;height:8px;margin-left:1px}
.tile b{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ped .one,.mk .one{font-size:16px;line-height:1.45}
.badge{justify-self:start;font:500 12px var(--mono);padding:4px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink)}
.row .b p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:10px;font:500 12px var(--mono);color:var(--muted)}
.dots span{display:inline-flex;align-items:center;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.otimo{background:var(--ok)} .dots i.bom{background:var(--warn)} .dots i.fraco{background:var(--bad)}
.row .b .dots{margin-top:3px}

/* nav */
nav.chips{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.chips .wrap{position:relative;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
nav.chips .wrap::-webkit-scrollbar{display:none}
nav.chips a{flex:none;text-decoration:none;font-size:14px;font-weight:500;padding:11px 15px;border-radius:999px;color:var(--muted);border:1px solid var(--line);background:var(--surface);transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
nav.chips a.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}
nav.chips a i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}

main .wrap{display:grid;gap:48px;padding-block:24px 72px}
section{display:grid;gap:18px;scroll-margin-top:72px;min-width:0}
section > *,.panel{min-width:0}
.sh{display:grid;gap:4px}
.sh h2{font:500 20px/1.15 var(--display);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:12px}
.sh h2 i{width:10px;height:10px;border-radius:50%;flex:none}
.sh p{color:var(--muted);font-size:14px;max-width:52ch}

/* grade de criativos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px}
.cr{display:grid;gap:9px;text-align:left;min-width:0}
.cr .ph{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--na-bg);
  box-shadow:0 1px 0 var(--line);transition:transform .35s var(--ease)}
@media (hover:hover){.cr:hover .ph{transform:translateY(-2px)}}
.cr img{width:100%;height:100%;object-fit:cover}
.cr .play{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.92);color:#111}
.cr .play svg{width:13px;height:13px;margin-left:2px}
.cr .flag{position:absolute;left:10px;top:10px;font:500 12px var(--mono);letter-spacing:.04em;background:rgba(17,24,20,.72);color:#fff;padding:4px 8px;border-radius:999px}
.cr .who{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cr .who b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .who span{font:500 12px var(--mono);color:var(--faint)}
.cr .msg{font-size:14px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.offer{justify-self:start;font:500 12px var(--mono);color:var(--brand);border:1px solid color-mix(in oklab,var(--brand) 30%,transparent);padding:3px 8px;border-radius:999px}
.noimg{display:grid;place-items:center;height:100%;padding:16px;text-align:center;font:400 20px/1.2 var(--display);color:var(--muted)}

/* linhas compactas */
.rows{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row .t{width:52px;aspect-ratio:4/5;border-radius:9px;overflow:hidden;background:var(--na-bg)}
.row .t img{width:100%;height:100%;object-fit:cover}
.row .b{min-width:0;display:grid;gap:2px}
.row .b b{font-weight:500;font-size:14px}
.row .b b span{font:500 12px var(--mono);color:var(--faint);margin-left:6px}
.row .b p{font-size:14px;color:var(--muted);line-height:1.4}
.row .go{color:var(--faint)}
.row .go svg{width:16px;height:16px}

/* pedidos */
.ped .top2{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:start}
.ped .big{position:relative;display:block;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--na-bg);box-shadow:0 1px 0 var(--line)}
.ped .big img{width:100%;height:100%;object-fit:cover}
.ped .big i{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#111}
.ped .big i svg{width:11px;height:11px;margin-left:2px}
.ped .pt{display:grid;gap:6px;align-content:start;min-width:0}
.ped .ref1{font-size:12px;color:var(--faint)}
.ped .more-refs{display:flex;gap:8px;flex-wrap:wrap}
.ped .more-refs button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 6px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:500;background:var(--bg)}
.ped .more-refs img{width:32px;height:32px;border-radius:50%;object-fit:cover}
/* mercado: abas, reels do TikTok, anúncios estilo feed, folha de baixo */
.seg{display:flex;padding:4px;border-radius:12px;background:var(--na-bg)}
.seg button{flex:1;min-height:44px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.panel[hidden]{display:none}
.reels{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-20px;padding-inline:20px;scroll-padding-inline:20px}
.reels::-webkit-scrollbar{display:none}
.reel{flex:none;width:136px;aspect-ratio:9/16;scroll-snap-align:start;border-radius:14px;overflow:hidden;position:relative;text-align:left;color:#fff;
  background:linear-gradient(165deg,#1d2b27 0%,#0b0f0d 70%);display:flex;flex-direction:column;justify-content:space-between;padding:12px}
.reel .pf{align-self:flex-start;font:500 12px var(--sans);background:rgba(255,255,255,.14);padding:4px 9px;border-radius:999px}
.reel b{font:400 20px/1.15 var(--display)}
.reel .likes{font:600 14px var(--sans);display:flex;align-items:center;gap:6px}
.reel .likes svg{width:14px;height:14px}
.ads{display:grid;gap:10px}
.ads h4{font:500 12px var(--sans);color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.ad{display:grid;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.ad .hd{display:flex;gap:10px;align-items:center}
.ad .av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 14px var(--sans);background:var(--na-bg);color:var(--brand)}
.ad .hd b{display:block;font-weight:600;font-size:14px}
.ad .hd small{display:block;font-size:12px;color:var(--faint)}
.ad q{font-size:16px;font-weight:500}
.ad .st{font-size:14px;color:var(--muted)}
.ad .ftr{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--faint)}
.ad .ftr span:last-child{color:var(--ink);font-weight:500}
dialog.sheet{margin:auto auto 0;width:100%;max-width:560px;height:auto;max-height:90dvh;border-radius:20px 20px 0 0;padding:0 20px calc(20px + env(safe-area-inset-bottom));overflow:auto;overscroll-behavior:contain}
@starting-style{dialog.sheet[open]{transform:translateY(100%);opacity:1}}
@media (min-width:701px){dialog.sheet{margin:auto;border-radius:20px}}
.sheet .grab{position:sticky;top:0;display:grid;place-items:center;height:28px;background:var(--bg);z-index:1;cursor:grab}
.sheet .grab span{width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet .sx{position:absolute;right:12px;top:10px;background:var(--na-bg);color:var(--ink);border-color:transparent;z-index:2}
.sheet .sh2{display:grid;gap:6px;margin-bottom:16px;padding-right:44px}
.sheet .sh2 h3{font:400 28px/1.05 var(--display)}
.sheet .why{color:var(--muted);font-size:16px}
.sheet ol{list-style:none;padding:0;display:grid;gap:10px;counter-reset:i;margin:8px 0 16px}
.sheet ol li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 14px 48px;position:relative;display:grid;gap:4px;font-size:14px}
.sheet ol li::before{counter-increment:i;content:counter(i);position:absolute;left:14px;top:14px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:600 12px var(--sans)}
.sheet ol li b{font-size:16px;font-weight:600}
.sheet ol li span{color:var(--muted)}
.sheet .kv{display:grid;gap:12px;margin:4px 0 16px}
.sheet .kv div{display:grid;gap:2px}
.sheet .kv dt{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.sheet .kv dd{margin:0;font-size:16px}
.sheet .emb{border:0;width:100%;height:min(740px,78dvh);border-radius:14px;margin-bottom:12px;background:#000}
.sheet h4{font:500 12px var(--sans);color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
/* mercado em lista (time) */
.mkl{display:grid;border-top:1px solid var(--line)}
.mkl details{border-bottom:1px solid var(--line)}
.mkl summary{list-style:none;cursor:pointer;min-height:60px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0}
.mkl summary::-webkit-details-marker{display:none}
.mkl summary b{font-weight:500;font-size:16px}
.mkl summary small{grid-column:1;font-size:12px;color:var(--faint)}
.mkl summary::after{content:"+";grid-row:1/span 2;grid-column:2;font-family:var(--mono);color:var(--faint)}
.mkl details[open] summary::after{content:"–"}
.mkl .body{display:grid;gap:10px;padding:0 0 16px;font-size:14px}
.mkl .body .why{color:var(--muted)}
.peds{display:grid;gap:12px}
.ped{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 4px;display:grid;gap:12px}
.ped .n{font:500 12px var(--mono);letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.ped h3{font:400 20px/1.15 var(--display)}
.ped dl{display:grid;gap:10px}
.ped dl div{display:grid;grid-template-columns:72px 1fr;gap:12px}
.ped dt{font:500 12px/1.9 var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.ped dd{margin:0;font-size:14px}
/* mercado */
.mk{display:grid;gap:12px}
.mk article{border:1px solid var(--line);border-radius:18px;padding:16px 16px 4px;display:grid;gap:10px}
.mk .n{font:500 12px var(--mono);letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.mk .n b{font-weight:500;color:var(--gold);margin-left:8px}
.mk h3{font:400 20px/1.15 var(--display)}
.mk p{font-size:14px}
.mk p.why{color:var(--muted)}
.mk p strong{font-weight:600}
.lk{display:flex;flex-wrap:wrap;gap:8px}
.lk a{display:inline-flex;color:var(--ink);align-items:center;gap:6px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;background:var(--bg)}
.lk a em{font:500 12px var(--mono);font-style:normal;color:var(--faint)}
.sig{display:grid;border-top:1px solid var(--line);margin-top:2px}
.sig a{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:14px}
.sig a span{min-width:0}
.sig a b{font-weight:600;margin-right:6px}
.sig a em{font:500 12px var(--mono);font-style:normal;color:var(--faint);white-space:nowrap}
.refs{display:flex;flex-wrap:wrap;gap:8px}
.ref{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:500;background:var(--bg)}
.ref img{width:26px;height:26px;border-radius:50%;object-fit:cover}

.note{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;gap:6px}
.note b{font-weight:600}
.note p{color:var(--muted);font-size:14px}
.tag{justify-self:start;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

details.legend{border-top:1px solid var(--line);color:var(--muted);font-size:14px}
details.legend summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:500;color:var(--ink)}
details.legend summary::-webkit-details-marker{display:none}
details.legend summary::after{content:"+";font-family:var(--mono);color:var(--faint)}
details.legend[open] summary::after{content:"–"}
.lg{display:grid;gap:10px;margin-top:12px}
.lg div{display:grid;grid-template-columns:80px 1fr;gap:10px}
.lg b{color:var(--ink);font-weight:600}

footer .wrap{padding-block:16px 40px;align-items:center;border-top:1px solid var(--line);color:var(--faint);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{text-decoration:none;color:var(--muted);display:inline-flex;align-items:center;min-height:44px}

/* player */
dialog{border:0;padding:0;margin:auto;max-width:min(980px,100vw);max-height:100dvh;width:100%;background:var(--bg);color:var(--ink);
  border-radius:24px;overflow:hidden;opacity:1;transform:none;transition:opacity .3s var(--ease),transform .3s var(--ease),display .3s allow-discrete,overlay .3s allow-discrete}
@starting-style{dialog[open]{opacity:0;transform:translateY(16px) scale(.98)}}
dialog::backdrop{background:rgba(5,8,6,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pl{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);max-height:92dvh}
.pl .media{background:#000;display:grid;place-items:center;min-height:0}
.pl video,.pl .media img{width:100%;height:100%;max-height:92dvh;object-fit:contain}
.pl .info{padding:28px 26px 24px;display:grid;gap:18px;align-content:start;overflow:auto}
.pl .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:7px}
.pill i{width:7px;height:7px;border-radius:50%}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.x svg{width:14px;height:14px}
.pl h3{font:400 28px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em}
.pl .tela{font-size:16px}
.meta{display:grid;gap:8px;font-size:14px}
.meta div{display:grid;grid-template-columns:78px 1fr;gap:10px}
.meta dt{font:500 12px/1.9 var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.meta dd{margin:0}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{border-radius:12px;padding:10px 12px;display:grid;gap:2px;background:var(--na-bg)}
.sc span{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sc b{font-weight:600;font-size:14px}
.sc em{font:500 12px var(--mono);font-style:normal;color:var(--muted)}
.sc.otimo{background:var(--ok-bg)} .sc.otimo b{color:var(--ok-ink)}
.sc.bom{background:var(--warn-bg)} .sc.bom b{color:var(--warn-ink)}
.sc.fraco{background:var(--bad-bg)} .sc.fraco b{color:var(--bad)}
.sc.na b{color:var(--faint)}
.pl .why{font:400 16px/1.5 var(--sans)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:500;font-size:14px;text-decoration:none;border:1px solid var(--line)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn svg{width:15px;height:15px}

@media (max-width:700px){
  dialog{border-radius:0;max-height:100dvh;height:100dvh}
  .pl{display:block;max-height:100dvh;height:100%;overflow:auto;overscroll-behavior:contain}
  .pl .media{height:64dvh}
  .pl video,.pl .media img{height:64dvh;max-height:64dvh}
  .pl .info{padding:20px max(20px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));overflow:visible}
  .x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;background:rgba(0,0,0,.55);color:#fff;border-color:transparent;z-index:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.c-ok{background:var(--ok)} .c-door{background:var(--door)} .c-warn{background:var(--warn)} .c-bad{background:var(--bad)} .c-neutral{background:var(--neutral)}
.p-ok{background:var(--ok-bg);color:var(--ok-ink)} .p-door{background:color-mix(in oklab,var(--door) 14%,transparent);color:var(--door)}
.p-warn{background:var(--warn-bg);color:var(--warn-ink)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-neutral{background:var(--na-bg);color:var(--muted)}
.loading #recado,.loading nav.chips,.loading main{visibility:hidden}
.skeleton{min-height:100vh;display:grid;place-items:center;color:var(--faint);font:500 12px var(--mono)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a href="../" aria-label="L'Amazonie Studio"><img class="logo light" src="../brand/logo-verde.png" width="90" height="26" alt="L'Amazonie"><img class="logo dark" src="../brand/logo-creme.png" width="127" height="19" alt="L'Amazonie"></a>
  <span class="eyebrow">Marketing e edição</span>
  <h1>Criativos <em>da semana</em></h1>
  <div class="period"><span id="periodo">carregando…</span><select id="ed" aria-label="Escolher semana" hidden></select></div>
</div></header>

<div class="wrap"><div class="recado" id="recado"></div></div>
<nav class="chips" aria-label="Seções"><div class="wrap" id="nav"></div></nav>
<main><div class="wrap" id="app"><div class="skeleton">carregando a semana…</div></div></main>
<footer><div class="wrap"><span>Atualizado toda segunda pelo Daniel · Meta Ads</span><a href="../">Ver a página das creators</a></div></footer>

<dialog id="dlg" aria-label="Criativo"></dialog>
<dialog id="sheet" class="sheet" aria-label="Ideias do mercado"></dialog>

<script>
const ICON = {
  play:'<svg viewBox="0 0 12 14" fill="currentColor"><path d="M0 0l12 7-12 7z"/></svg>',
  x:'<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l12 12M13 1L1 13"/></svg>',
  dl:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1v10M3.5 6.5L8 11l4.5-4.5M2 14.5h12"/></svg>',
  heart:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 14.5S1.5 10.6 1.5 5.8A3.3 3.3 0 0 1 8 4.3a3.3 3.3 0 0 1 6.5 1.5c0 4.8-6.5 8.7-6.5 8.7z"/></svg>',
  go:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3l5 5-5 5"/></svg>'
};
const TONE = {ok:['c-ok','p-ok','Campeão'],door:['c-door','p-door','Abre-porta'],warn:['c-warn','p-warn','Cansando'],bad:['c-bad','p-bad','Não repetir'],neutral:['c-neutral','p-neutral','Abaixo do ideal'],rmkt:['c-neutral','p-neutral','Remarketing'],ref:['c-neutral','p-neutral','Referência']};
const RANGES = {gancho:[35,25],historia:[40,25],chamada:[1.5,1]};
const LBL = {otimo:'Ótimo',bom:'Bom',fraco:'Fraco'};
const tier = (k,v)=> v==null ? null : k==='cpm' ? (v<=30?'otimo':v<=50?'bom':'fraco') : k==='freq' ? (v<2?'otimo':v<=3?'bom':'fraco') : v>=RANGES[k][0] ? 'otimo' : v>=RANGES[k][1] ? 'bom' : 'fraco';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let C = {}, E = null, INDEX = {}, MK = null;
const VIEW = document.documentElement.dataset.view || 'creators', BASE = document.documentElement.dataset.base || '';
const fmt = (k,v)=> v==null ? '' : k==='cpm' ? 'R$ '+v.toFixed(2).replace('.',',') : k==='freq' ? v.toFixed(2).replace('.',',') : k==='chamada' ? v.toFixed(2).replace('.',',')+'%' : v.toFixed(1).replace('.',',')+'%';

const dots = it => VIEW!=='time' || !it.notas ? '' : `<span class="dots">${[['gancho','G','Gancho'],['historia','H','História'],['chamada','C','Chamada']].map(([k,l,t])=>{const v=tier(k,it.notas[k]);return `<span title="${t}: ${v?LBL[v]:'sem dado'}"><i class="${v||''}"></i>${l}</span>`}).join('')}</span>`;
const poster = c => C[c]?.semImagem ? null : `${BASE}media/${c}.jpg`;
const who = c => { const g = C[c]?.gravou; if (g==='A confirmar') return VIEW==='time' ? 'A confirmar' : 'Creator'; return g || C[c]?.editou || ''; };

function card(it, tone){
  const c = C[it.code]; const p = poster(it.code);
  INDEX[it.code] = {it, tone};
  return `<button class="cr" data-code="${it.code}">
    <div class="ph">${p?`<img src="${p}" alt="" loading="lazy" decoding="async">`:`<div class="noimg">${esc(c.tela)}</div>`}
      ${it.flag&&VIEW==='time'?`<span class="flag">${esc(it.flag)}</span>`:''}
      ${c.tipo==='video'?`<span class="play" aria-hidden="true">${ICON.play}</span>`:''}</div>
    <div class="who"><b>${esc(who(it.code))}</b>${VIEW==='time'?`<span>${it.code}</span>`:''}</div>
    ${dots(it)}
    ${VIEW==='time'?`<span class="offer">${esc(c.oferta)}</span>`:''}
  </button>`;
}
function row(it, tone, keep){
  const c = C[it.code]; const p = poster(it.code);
  if (!keep || !INDEX[it.code]) INDEX[it.code] = {it, tone};
  return `<button class="row" data-code="${it.code}">
    <span class="t">${p?`<img src="${p}" alt="" loading="lazy" decoding="async">`:''}</span>
    <span class="b"><b>${esc(who(it.code))}${VIEW==='time'?`<span>${it.code}</span>`:''}</b><p>${esc(it.recado)}</p>${dots(it)}</span>
    <span class="go">${ICON.go}</span></button>`;
}
function sec(id, title, sub, tone, body, nav){
  return `<section id="${id}" data-nav="${esc(nav||title)}"data-tone="${tone||''}"><div class="sh"><h2>${tone?`<i class="${TONE[tone][0]}"></i>`:''}${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:''}</div>${body}</section>`;
}

function render(){
  INDEX = {};
  document.getElementById('periodo').textContent = `${E.periodo} · Edição ${String(E.edicao).padStart(2,'0')}`;
  document.getElementById('recado').innerHTML = E.manchete
    ? `<p class="headline">${esc(E.manchete)}</p>${E.chaves?.length?`<div class="keys">${E.chaves.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}
       <details class="more"><summary>Resumo completo</summary><div>${E.recado.map(r=>`<p>${esc(r)}</p>`).join('')}<p class="lesson">${esc(E.aprendizado)}</p></div></details>`
    : `<ol>${E.recado.map(r=>`<li><span>${esc(r)}</span></li>`).join('')}</ol><p class="lesson">${esc(E.aprendizado)}</p>`;

  let h = '';
  const thumb = c => poster(c)?`<img src="${poster(c)}" alt="" width="112" height="140" loading="lazy" decoding="async">`:'';
  h += sec('pedidos','Pedidos da semana', E.pedidosSub||'O que gravar agora.','',
    `<div class="peds">${E.pedidos.map(p=>{ const [b0,...bs]=p.base; return `<article class="ped">
      <div class="top2"><button class="big" data-code="${b0}" aria-label="Ver vídeo de referência">${thumb(b0)}<i>${ICON.play}</i></button>
        <div class="pt"><h3>${esc(p.titulo)}</h3>${p.resumo?`<p class="one">${esc(p.resumo)}</p>`:''}<span class="ref1">Referência: ${VIEW==='time'?b0:esc(who(b0))}</span></div></div>
      ${bs.length?`<div class="more-refs">${bs.map(c=>`<button data-code="${c}">${poster(c)?`<img src="${poster(c)}" alt="" width="32" height="32" loading="lazy">`:''}${VIEW==='time'?c:esc(who(c))}</button>`).join('')}</div>`:''}
      <details class="more"><summary>Como fazer</summary><div><dl><div><dt>Quem</dt><dd>${esc(p.quem)}</dd></div><div><dt>Manter</dt><dd>${esc(p.manter)}</dd></div><div><dt>Trocar</dt><dd>${esc(p.trocar)}</dd></div></dl></div></details></article>`}).join('')}</div>`);

  const M = E.mercado;
  if (M?.tiktok?.length || M?.anuncios?.length){
    MK = M;
    const reels = `<div class="reels">${(M.tiktok||[]).map((t,i)=>`<button class="reel" data-mk="t${i}"><span class="pf">TikTok</span><b>${esc(t.titulo)}</b><span class="likes">${ICON.heart}${esc(t.numero)}</span></button>`).join('')}</div>`;
    const ad = (x,i) => `<button class="ad" data-mk="a${i}"><span class="hd"><span class="av">${esc(x.marca[0])}</span><span><b>${esc(x.marca)}</b><small>Patrocinado · ${esc(x.pais)}${x.versoes?` · ${x.versoes} versões`:''}</small></span></span>
      ${x.semTitulo?`<span class="st"><b>${esc(x.titulo)}</b></span>`:`<q>${esc(x.titulo)}</q>`}<span class="st">${esc(x.estrutura)}</span><span class="ftr"><span>No ar ${esc(x.ha)}</span><span>Ver ideia</span></span></button>`;
    const A = (M.anuncios||[]).map((x,i)=>[x,i]);
    const ads = `<div class="ads"><h4>No ar há mais de 30 dias</h4>${A.filter(([x])=>x.dias>=30).map(([x,i])=>ad(x,i)).join('')}<h4>Novos (marcas testando)</h4>${A.filter(([x])=>x.dias<30).map(([x,i])=>ad(x,i)).join('')}</div>`;
    const body = VIEW==='time' && M.anuncios?.length
      ? `<div class="seg" role="tablist"><button role="tab" aria-selected="true" data-tab="tt">TikTok · virais</button><button role="tab" aria-selected="false" data-tab="ad">Anúncios lá fora</button></div>
         <div class="panel" data-panel="tt">${reels}</div><div class="panel" data-panel="ad" hidden>${ads}</div>`
      : reels;
    h += sec('mercado','O que o mercado pede', M.sub, '', body, 'Mercado');
  }

  for (const s of E.secoes) h += sec(s.id, s.titulo, s.sub, s.tom, `<div class="grid">${s.itens.map(it=>card(it,s.tom)).join('')}</div>`);

  h += sec('nao-repetir','Não repetir','Formatos que falharam mais de uma vez na venda.','bad',
    E.naoRepetir.map(n=>`<div class="note"><b>${esc(n.titulo)}</b><p>${esc(n.texto)}</p></div><div class="rows">${n.itens.map(it=>row(it,'bad')).join('')}</div>`).join(''));

  if (E.abaixo?.length) h += sec('abaixo','Abaixo do ideal','Para aprender, não para copiar. Cada um com o que dá pra aproveitar.','neutral',
    `<div class="rows">${E.abaixo.map(it=>row(it,'neutral')).join('')}</div>`);

  if (E.remarketing?.length) h += sec('remarketing','Remarketing','Só referência. Fala com quem já quase comprou. Não copiar para público novo.','rmkt',
    `<div class="rows">${E.remarketing.map(it=>row(it,'rmkt')).join('')}</div>`);

  const mes = E.mesAnterior;
  h += sec('arquivo', mes ? 'Arquivo' : 'Como ler', mes ? `Venceram no mês anterior (${mes.periodo}). As edições passadas ficam no seletor do topo.` : '','',
    `${mes?`<div class="rows">${mes.codes.map(c=>row({code:c,recado:`${C[c].formato} · ${C[c].angulo}`},'ok',true)).join('')}</div>`:''}
     <details class="legend"><summary>Como ler as notas</summary><div class="lg">
       <div><b>Gancho</b><span>Parou o scroll? Ótimo ≥ 35% · Bom 25–35% · Fraco &lt; 25%</span></div>
       <div><b>História</b><span>Assistiu até o fim? Ótimo ≥ 40% · Bom 25–40% · Fraco &lt; 25%</span></div>
       <div><b>Chamada</b><span>Clicou? Ótimo ≥ 1,5% · Bom 1–1,5% · Fraco &lt; 1%</span></div>
       ${VIEW==='time'?`<div><b>CPM</b><span>Custo de mil impressões, já com imposto. Ótimo ≤ R$ 30 · Bom R$ 30–50 · Fraco &gt; R$ 50</span></div><div><b>Frequência</b><span>Vezes que a mesma pessoa viu na semana. Ótimo &lt; 2 · Bom 2–3 · Fraco &gt; 3</span></div>`:''}
       ${VIEW==='time'?`<div><b>Bolinhas</b><span>Embaixo de cada capa: G gancho, H história, C chamada. Verde ótimo · amarelo bom · vermelho fraco · cinza sem dado (imagem)</span></div>`:''}
       ${VIEW==='time'?`<div><b>Categoria</b><span>Vem da venda real de cada anúncio (Solomon). Imagem não tem gancho nem história.</span></div>`:''}</div></details>`);

  document.getElementById('app').innerHTML = h;
  document.getElementById('nav').innerHTML = [...document.querySelectorAll('section[data-nav]')].filter(s=>!(s.id==='arquivo'&&!E.mesAnterior)).map(s=>{
    const t = s.dataset.tone; return `<a href="#${s.id}" data-id="${s.id}">${t?`<i class="${TONE[t][0]}"></i>`:''}${s.dataset.nav.replace(' da semana','')}</a>`}).join('');
  spy();
}

function open(code){
  const c = C[code]; const {it, tone} = INDEX[code] || {it:{code,notas:null},tone:'ref'};
  const t = TONE[tone] || TONE.neutral; const n = it.notas || {};
  const sc = (k,label)=>{ const v=n[k]; const tr=tier(k,v); return `<div class="sc ${tr||'na'}"><span>${label}</span><b>${tr?LBL[tr]:'n/a'}</b>${VIEW==='time'&&v!=null?`<em>${fmt(k,v)}</em>`:''}</div>`; };
  const media = c.tipo==='video'
    ? `<video src="${BASE}media/${code}.mp4" poster="${BASE}media/${code}.jpg" controls playsinline autoplay preload="metadata"></video>`
    : (poster(code)?`<img src="${poster(code)}" alt="${esc(c.tela)}">`:`<div class="noimg" style="color:#ccc">${esc(c.tela)}</div>`);
  const file = c.tipo==='video' ? `${BASE}media/${code}.mp4` : (poster(code)||'');
  const name = `${code}-${(c.gravou||c.editou||'').replace(/\s+/g,'-')}`;
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<div class="pl"><div class="media">${media}</div><div class="info">
    <div class="top"><span class="pill ${t[1]}"><i class="${t[0]}"></i>${t[2]}</span><button class="x" data-close aria-label="Fechar">${ICON.x}</button></div>
    <div><h3>${esc(c.gravou||'Imagem')}</h3><p class="tela">${esc(c.tela)}</p></div>
    ${it.recado?`<p class="why">${esc(it.recado)}</p>`:''}
    <dl class="meta">
      ${VIEW==='time'?`<div><dt>Código</dt><dd>${code}</dd></div>`:''}
      <div><dt>Formato</dt><dd>${esc(c.formato)}${c.dur?` · ${c.dur}s`:''}</dd></div>
      <div><dt>Ângulo</dt><dd>${esc(c.angulo)}</dd></div>
      ${VIEW==='time'?`<div><dt>Oferta</dt><dd>${esc(c.oferta)}</dd></div><div><dt>Edição</dt><dd>${esc(c.editou)}</dd></div>`:''}
    </dl>
    ${it.notas?`<div class="scores">${sc('gancho','Gancho')}${sc('historia','História')}${sc('chamada','Chamada')}${VIEW==='time'?sc('cpm','CPM')+sc('freq','Frequência'):''}</div>`:''}
    <div class="actions">${file?`<a class="btn primary" href="${file}" download="${name}${c.tipo==='video'?'.mp4':'.jpg'}">${ICON.dl}Baixar ${c.tipo==='video'?'vídeo':'imagem'}</a>`:''}
      <button class="btn" data-close>Fechar</button></div>
  </div></div>`;
  dlg.showModal();
  history.replaceState(null,'',`#${code}`);
}
const ttId = u => (u||'').match(/video\/(\d+)/)?.[1];
function openMk(key){
  const sh = document.getElementById('sheet'); const top = `<div class="grab" data-grab><span></span></div><button class="x sx" data-close aria-label="Fechar">${ICON.x}</button>`;
  if (key[0]==='t'){ const t = MK.tiktok[+key.slice(1)];
    sh.innerHTML = `${top}<div class="sh2"><span class="pill p-neutral">TikTok · ${esc(t.numero)} curtidas</span><h3>${esc(t.titulo)}</h3><p class="why">${esc(t.porque)}</p></div>
      <h4>3 ideias pra gravar</h4><ol>${t.ideias.map(i=>`<li><b>“${esc(i.tela)}”</b><span>${esc(i.cena)}</span><span>Final: ${esc(i.final)}</span></li>`).join('')}</ol>
      <div class="actions"><button class="btn primary" data-emb="${ttId(t.url)}">${ICON.play}Assistir o viral aqui</button><a class="btn" href="${esc(t.url)}" target="_blank" rel="noopener">Abrir no TikTok</a>${t.outro?`<a class="btn" href="${esc(t.outro)}" target="_blank" rel="noopener">Ver outro</a>`:''}</div><div data-embbox></div>`;
  } else { const x = MK.anuncios[+key.slice(1)];
    sh.innerHTML = `${top}<div class="sh2"><span class="pill p-neutral">Anúncio · ${esc(x.marca)} · no ar ${esc(x.ha)}</span><h3>${x.semTitulo?esc(x.titulo):`“${esc(x.titulo)}”`}</h3></div>
      <dl class="kv"><div><dt>O que eles fazem</dt><dd>${esc(x.estrutura)}</dd></div><div><dt>A nossa versão</dt><dd>${esc(x.nossa)}</dd></div><div><dt>Pra quem</dt><dd>${esc(x.para)}</dd></div><div><dt>Desde</dt><dd>${esc(x.desde)}${x.versoes?` · ${x.versoes} versões no ar`:''}</dd></div></dl>
      <div class="actions"><a class="btn primary" href="${esc(x.url)}" target="_blank" rel="noopener">Abrir na Biblioteca de Anúncios</a></div>`; }
  sh.scrollTop = 0; sh.showModal();
}
function closeSheet(){ const sh=document.getElementById('sheet'); sh.style.transform=''; sh.innerHTML=''; sh.close(); }
(()=>{ const sh=document.getElementById('sheet'); let y0=null, dy=0;
  sh.addEventListener('touchstart',e=>{ if(e.target.closest('[data-grab]')||sh.scrollTop<=0){ y0=e.touches[0].clientY; dy=0; } },{passive:true});
  sh.addEventListener('touchmove',e=>{ if(y0==null) return; dy=e.touches[0].clientY-y0; if(dy>0 && sh.scrollTop<=0){ sh.style.transform=`translateY(${dy}px)`; } },{passive:true});
  sh.addEventListener('touchend',()=>{ if(y0==null) return; y0=null; if(dy>110) closeSheet(); else sh.style.transform=''; });
  sh.addEventListener('cancel',e=>{ e.preventDefault(); closeSheet(); });
})();
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-tab]'); if (t){ const box=t.closest('section'); box.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected', b===t)); box.querySelectorAll('[data-panel]').forEach(p=>p.hidden = p.dataset.panel!==t.dataset.tab); return; }
  const m = e.target.closest('[data-mk]'); if (m){ openMk(m.dataset.mk); return; }
  const em = e.target.closest('[data-emb]'); if (em){ const box=document.querySelector('[data-embbox]'); box.innerHTML=`<iframe class="emb" src="https://www.tiktok.com/embed/v2/${em.dataset.emb}?lang=pt-BR" allow="encrypted-media; fullscreen; autoplay" allowfullscreen title="Vídeo do TikTok"></iframe>`; em.remove(); box.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const sh = document.getElementById('sheet'); if (sh.open && (e.target===sh || e.target.closest('#sheet [data-close]'))){ closeSheet(); return; }
  const b = e.target.closest('[data-code]'); if (b){ open(b.dataset.code); return; }
  if (e.target.closest('[data-close]') || e.target.id==='dlg') close();
});
function close(){ const d=document.getElementById('dlg'); d.querySelector('video')?.pause(); d.close(); history.replaceState(null,'',location.pathname+location.search); }
document.getElementById('dlg').addEventListener('cancel', e=>{ e.preventDefault(); close(); });

function spy(){
  const links = [...document.querySelectorAll('#nav a')];
  const bar = document.getElementById('nav'); let cur = '';
  const io = new IntersectionObserver(es=>{ es.forEach(x=>{ if(!x.isIntersecting || x.target.id===cur) return; cur = x.target.id;
    links.forEach(l=>l.classList.toggle('on', l.dataset.id===cur));
    const a = links.find(l=>l.dataset.id===cur); if (!a) return;
    requestAnimationFrame(()=>bar.scrollTo({left: a.offsetLeft - (bar.clientWidth - a.offsetWidth)/2, behavior:'smooth'})); }); },{rootMargin:'-30% 0px -60% 0px'});
  document.querySelectorAll('section[data-nav]').forEach(s=>io.observe(s));
}

async function boot(){
  const [idx, cat] = await Promise.all([fetch(`${BASE}data/edicoes.json`).then(r=>r.json()), fetch(`${BASE}data/criativos.json`).then(r=>r.json())]);
  C = cat;
  const want = new URLSearchParams(location.search).get('e') || idx.edicoes[0].id;
  E = await fetch(`${BASE}data/${VIEW==='time'?'time/':''}${want}.json`).then(r=>r.json());
  const sel = document.getElementById('ed');
  if (idx.edicoes.length > 1){ sel.hidden = false; sel.innerHTML = idx.edicoes.map(x=>`<option value="${x.id}" ${x.id===want?'selected':''}>${x.periodo}</option>`).join(''); sel.onchange = ()=>{ location.search = '?e='+sel.value; }; }
  await Promise.race([document.fonts?.ready, new Promise(r=>setTimeout(r,700))]);
  render();
  document.documentElement.classList.remove('loading');
  const h = location.hash.slice(1); if (/^LA\d{4}$/.test(h) && C[h]) open(h);
}
boot().catch(()=>{ document.documentElement.classList.remove('loading'); document.getElementById('app').innerHTML = '<div class="skeleton">Não foi possível carregar. Atualize a página.</div>'; });
</script>
